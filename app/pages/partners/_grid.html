{% if partners %}
<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
  {% for p in partners %}
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm flex flex-col items-center p-4 gap-3">
    {% if p.logo_image %}
      <img src="{{ p.logo_image }}" alt="{{ p.partner_name }}" class="h-16 w-full object-contain rounded-lg">
    {% else %}
      <div class="h-16 w-full flex items-center justify-center bg-slate-100 rounded-lg text-slate-400">
        <span class="material-symbols-outlined text-3xl">store</span>
      </div>
    {% endif %}

    <p class="text-sm font-semibold text-slate-800 text-center leading-tight">{{ p.partner_name }}</p>

    <button
      class="mt-auto text-xs px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-lime-100 hover:text-lime-800 transition"
      hx-get="/partners/{{ p.id }}/form"
      hx-target="#modal-body"
      hx-swap="innerHTML"
      onclick="openPartnerModal('Edit Partner')"
    >
      Edit
    </button>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="flex flex-col items-center justify-center py-20 text-slate-400">
  <span class="material-symbols-outlined text-5xl mb-3">search_off</span>
  <p class="text-lg font-medium">No partners found</p>
</div>
{% endif %}
