<!doctype html>
<html lang="en">
<head>

  <style>

    body {

    }

    .container-main {

      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }

      border-bottom: 2px solid transparent;

    .nav-link:hover {
      color: #FA453D;
      border-bottom-color: #FA453D;
    }

    .nav-link-active {
      color: #FA453D;

  <nav class="bg-white border-b border-black/10">
    <div class="container-main relative">
      <div class="relative flex items-center justify-center h-[72px]">

        <a href="#" class="absolute left-4 top-1/2 -translate-y-1/2">

            src="/static/v2/the_unlimited_logo.png"

            class="h-auto max-h-10 w-auto"

        </a>

        <div class="hidden md:flex items-center gap-8">
          <a href="#" class="nav-link nav-link-active">Rewards</a>
