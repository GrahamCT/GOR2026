<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>

  <!-- Flatpickr -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <link rel="icon" type="image/svg+xml"
    href="https://theunlimited-lifestyle.co.za/benefits/wp-content/themes/gorhino-wda/unlimitedfavicon.svg" />


  <title>The Unlimited Lifestyle</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style>
    /* TheUnlimitedSans — Standard weights (used via font-weight) */
    @font-face {
      font-family: 'TheUnlimitedSans';
      src: url('/static/fonts/unlimitedsans/TheUnlimitedSans-Regular.woff2') format('woff2'),
           url('/static/fonts/unlimitedsans/TheUnlimitedSans-Regular.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheUnlimitedSans';
      src: url('/static/fonts/unlimitedsans/TheUnlimitedSans-Medium.woff2') format('woff2'),
           url('/static/fonts/unlimitedsans/TheUnlimitedSans-Medium.woff') format('woff');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheUnlimitedSans';
      src: url('/static/fonts/unlimitedsans/TheUnlimitedSans-SemiBold.woff2') format('woff2'),
           url('/static/fonts/unlimitedsans/TheUnlimitedSans-SemiBold.woff') format('woff');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheUnlimitedSans';
      src: url('/static/fonts/unlimitedsans/TheUnlimitedSans-Bold.woff2') format('woff2'),
           url('/static/fonts/unlimitedsans/TheUnlimitedSans-Bold.woff') format('woff');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheUnlimitedSans';
      src: url('/static/fonts/unlimitedsans/TheUnlimitedSans-Heavy.woff2') format('woff2'),
           url('/static/fonts/unlimitedsans/TheUnlimitedSans-Heavy.woff') format('woff');
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheUnlimitedSans';
      src: url('/static/fonts/unlimitedsans/TheUnlimitedSans-Black.woff2') format('woff2'),
           url('/static/fonts/unlimitedsans/TheUnlimitedSans-Black.woff') format('woff');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }
    /* TheUnlimitedSans — Specialty cuts (used via font-family name) */
    @font-face {
      font-family: 'TheUnlimitedSans-Super';
      src: url('/static/fonts/unlimitedsans/TheUnlimitedSans-Super.woff2') format('woff2'),
           url('/static/fonts/unlimitedsans/TheUnlimitedSans-Super.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheUnlimitedSans-Ultra';
      src: url('/static/fonts/unlimitedsans/TheUnlimitedSans-Ultra.woff2') format('woff2'),
           url('/static/fonts/unlimitedsans/TheUnlimitedSans-Ultra.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheUnlimitedSans-Display';
      src: url('/static/fonts/unlimitedsans/TheUnlimitedSans-Display.woff2') format('woff2'),
           url('/static/fonts/unlimitedsans/TheUnlimitedSans-Display.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'TheUnlimitedSans-Base';
      src: url('/static/fonts/unlimitedsans/TheUnlimitedSans-Base.woff2') format('woff2'),
           url('/static/fonts/unlimitedsans/TheUnlimitedSans-Base.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* Gilroy */
    @font-face {
      font-family: 'Gilroy';
      src: url('/static/fonts/gilroy/Gilroy-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gilroy';
      src: url('/static/fonts/gilroy/Gilroy-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gilroy';
      src: url('/static/fonts/gilroy/Gilroy-SemiBold.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gilroy';
      src: url('/static/fonts/gilroy/Gilroy-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gilroy';
      src: url('/static/fonts/gilroy/Gilroy-ExtraBold.otf') format('opentype');
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gilroy';
      src: url('/static/fonts/gilroy/Gilroy-Black.otf') format('opentype');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    body {
      font-family: 'TheUnlimitedSans', sans-serif;
    }

    .container-main {
      width: 100%;
      padding-left: 0;
      padding-right: 0;
    }

    .nav-link {
      font-family: 'Space Grotesk', sans-serif;
      color: #1A1C1C;
      font-size: 16px;
      font-style: normal;
      font-weight: 700;
      line-height: 24px;
      letter-spacing: -0.4px;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .nav-link:hover {
      color: #FA453D;
      border-bottom-color: #FA453D;
    }

    .nav-link-active {
      color: #FA453D;
      border-bottom-color: #FA453D;
    }
  </style>
</head>

<body class="bg-[#F7F7F7]">

  <nav class="bg-white border-b border-black/10 sticky top-0 z-50">
    <div class="container-main relative">
      <div class="relative flex items-center justify-center h-[72px]">

        <a href="#" class="absolute left-4 top-1/2 -translate-y-1/2">
          <img src="/static/v2/the_unlimited_logo.png" alt="The Unlimited" class="h-auto max-h-10 w-auto">
        </a>

        <div class="hidden md:flex items-center gap-8">
          <a href="/benefits/category" class="nav-link {{ 'nav-link-active' if current_page == '0' else '' }}">Rewards</a>
          <a href="/benefits/select/1" class="nav-link {{ 'nav-link-active' if current_page == '1' else '' }}">Dining</a>
          <a href="/benefits/select/2" class="nav-link {{ 'nav-link-active' if current_page == '2' else '' }}">Coffee</a>
          <a href="/benefits/select/3" class="nav-link {{ 'nav-link-active' if current_page == '3' else '' }}">Experiences</a>
        </div>

        <!-- Hamburger button — mobile only -->
        <button id="menu-btn" class="md:hidden absolute right-4 top-1/2 -translate-y-1/2 p-2" aria-label="Toggle menu">
          <svg id="icon-open" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <svg id="icon-close" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>

      </div>

      <!-- Mobile dropdown -->
      <div id="mobile-menu" class="hidden border-t border-black/10 bg-white">
        <div class="flex flex-col px-4 py-3 gap-1">
          <a href="/benefits/category" class="nav-link py-3 {{ 'nav-link-active' if current_page == '0' else '' }}">Rewards</a>
          <a href="/benefits/select/1" class="nav-link py-3 {{ 'nav-link-active' if current_page == '1' else '' }}">Dining</a>
          <a href="/benefits/select/2" class="nav-link py-3 {{ 'nav-link-active' if current_page == '2' else '' }}">Coffee</a>
          <a href="/benefits/select/3" class="nav-link py-3 {{ 'nav-link-active' if current_page == '3' else '' }}">Experiences</a>
        </div>
      </div>

    </div>
  </nav>

  <script>
    (function () {
      var btn = document.getElementById('menu-btn');
      var menu = document.getElementById('mobile-menu');
      var iconOpen = document.getElementById('icon-open');
      var iconClose = document.getElementById('icon-close');
      btn.addEventListener('click', function () {
        var isOpen = !menu.classList.contains('hidden');
        menu.classList.toggle('hidden', isOpen);
        iconOpen.classList.toggle('hidden', !isOpen);
        iconClose.classList.toggle('hidden', isOpen);
      });
    })();
  </script>

  {% block content %}

  <!-- PAGE CONTENT -->
  <section class="bg-[#F7F7F7]">
    <div class="container-main py-8">
      <!-- your page content here -->
    </div>
  </section>

  {% endblock content %}



<br>
  {% include '/benefits_v2/_footer.html' %}




<p class="text-sm text-gray-400 italic">v{{ app_version }}</p>




</body>

</html>
