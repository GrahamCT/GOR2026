<style>
  @keyframes shimmer {
    0%   { background-position: -400px 0; }
    100% { background-position:  400px 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
    background-size: 800px 100%;
    animation: shimmer 1.4s infinite linear;
  }
  .partner-logo { opacity: 0; transition: opacity 0.3s ease; }
  .partner-logo.loaded { opacity: 1; }
</style>

<section>
  <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:16px;justify-content:center;">
    {% for p in partners %}

  <a
  href="/v2/partner/{{ p.id }}"
  class="relative w-[163px] h-[163px] bg-white rounded-2xl shadow-md
         border border-slate-100
         flex items-center justify-center
         hover:shadow-lg hover:-translate-y-0.5
         active:translate-y-0
         transition overflow-hidden"
>
  <!-- Skeleton shown until image loads -->
  <span class="skeleton absolute inset-0 rounded-2xl"></span>

  <!-- Logo fades in on load -->
  <img
    src="{{ url_for('static', path=p.logo_image) if p.logo_image else 'https://placehold.co/200x200?text=' ~ p.partner_name | replace(' ', '+') }}"
    alt="{{ p.partner_name }}"
    loading="lazy"
    class="partner-logo relative max-h-[110px] max-w-[110px] object-contain"
    onload="this.classList.add('loaded'); this.previousElementSibling.remove();"
  />
</a>

   
    {% endfor %}
  </div>
</section>
