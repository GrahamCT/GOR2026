{% extends 'benefits_v2/base.html' %}

{% block content %}

<!-- HERO -->
<section class="bg-[#F7F7F7] mb-16">
  <div class="container-main">
    <div class="relative overflow-hidden">

      <!-- HERO IMAGE -->
      <img
        src="/static/v2/hero_login.png"
        alt="Hero banner"
        class="block w-full h-auto object-cover"
      >

      <!-- WELCOME TEXT -->
      <div class="absolute inset-0 flex flex-col justify-center pl-8 md:pl-14" style="max-width: 50%;">
        <h1 style="font-family: 'TheUnlimitedSans'; font-weight: 900; font-size: 100px; line-height: 81%; font-style: normal; color: #FA453D; text-transform: uppercase; width: 508px; flex-shrink: 0;">
          Welcome to<br>My Unlimited
        </h1>
        <p style="font-family: 'Gilroy'; font-weight: 600; font-size: 24px; font-style: normal; line-height: 32px; color: #FFF; width: 462px; margin-top: 50px;">
          You've come to the right place to start saving big with 2-for-1 dining, coffees and experiences!
        </p>
      </div>

      <!-- LOGIN CARD -->
      <div class="absolute inset-0 flex items-center justify-end pr-6 md:pr-12">
        <div class="px-8 py-10 flex flex-col justify-center" style="width: 469.34px; height: 381px; border-radius: 20px; background: #fff; box-shadow: 0 32px 64px -12px rgba(26,28,28,0.08);">


          <h2 style="display: flex; width: 387px; height: 60px; flex-direction: column; justify-content: center; color: #FA453D; font-family: 'Gilroy'; font-size: 50px; font-style: normal; font-weight: 700; line-height: 60px;">
            2-for-1 Rewards
          </h2>

          <hr class="my-6 border-black/10">

          <p style="align-self: stretch; color: #1A1C1C; font-family: 'Gilroy'; font-size: 24px; font-style: normal; font-weight: 600; line-height: 32px;" class="mb-6">
            Log in to start saving!
          </p>

          <form
            hx-post="/v2/tug_login"
            hx-target="#login-result"
            hx-swap="innerHTML"
            hx-indicator="#login-indicator"
          >
            <div class="mb-6">
              <label style="display: flex; width: 116.95px; height: 15px; flex-direction: column; justify-content: center; color: rgba(26,28,28,0.40); font-family: 'Gilroy'; font-size: 10px; font-style: normal; font-weight: 400; line-height: 15px; text-transform: uppercase;" class="mb-2">
                Cell phone number
              </label>
              <input
                name="mobile_number"
                type="number"
                maxlength="10"
                required
                placeholder="0000000000"
                class="w-full bg-[#F3F3F3] rounded-lg px-4 py-3 outline-none" style="color: #6B7280; font-family: 'Gilroy'; font-size: 14px; font-style: normal; font-weight: 400; line-height: normal;"
              >
            </div>

            <button type="submit" class="flex h-[50px] w-full max-w-[294px] overflow-hidden rounded-[4px]">
              <span class="flex flex-1 items-center bg-[#FF4B43] px-5" style="color: #FFF; font-family: 'Gilroy'; font-size: 16px; font-style: normal; font-weight: 700; line-height: normal; text-transform: uppercase;">
                Login
              </span>
              <span class="flex w-[48px] items-center justify-center bg-black text-white">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <path d="M5 12h14"></path>
                  <path d="M13 5l7 7-7 7"></path>
                </svg>
              </span>
            </button>

            <div id="login-result" class="mt-4"></div>
          </form>

        </div>
      </div>

    </div>
  </div>
</section>



{% include 'benefits_v2/_by_the_numbers.html' %}


{% endblock content %}


</div>
