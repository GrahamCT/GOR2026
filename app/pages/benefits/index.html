<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Unlimited Lifestyle</title>

  <link rel="icon" type="image/ico" href="{{ url_for('static', path='fav.png') }}">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>

  <style>
    /* Desktop full-page background only */
    @media (min-width: 768px) {
      body {
        background-image: url("{{ url_for('static', path='login-bg.jpg') }}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
    }
  </style>
</head>

<body class="min-h-screen font-sans">

  <!-- ===== MOBILE HERO (hidden on desktop) ===== -->
  <div
    class="md:hidden relative"
    style="min-height: 58vh;
           background-image: url('{{ url_for('static', path='v2/mb_login.png') }}');
           background-size: cover;
           background-position: center top;
           background-repeat: no-repeat;"
  >
    <!-- Logo top-left -->
    <div class="absolute top-4 left-4">
      <img
        src="{{ url_for('static', path='tug_logo.png') }}"
        alt="The Unlimited"
        class="h-8 w-auto"
      />
    </div>

    <!-- Heading image overlaid in lower-left of the hero -->
    <div class="absolute bottom-14 left-4">
      <img
        src="{{ url_for('static', path='v2/mb_login_Heading 1.png') }}"
        alt="MY UNLIMITED"
        class="w-[200px] max-w-[55vw] h-auto"
      />
    </div>
  </div>

  <!-- ===== DESKTOP HEADER (hidden on mobile) ===== -->
  <div class="hidden md:block">
    <div class="h-8"></div>
    <div class="h-8"></div>
    <p class="pl-[5px]">
      <img
        src="{{ url_for('static', path='tug_logo.png') }}"
        alt="The Unlimited"
        class="h-12 w-auto"
      />
    </p>
    <div class="h-8"></div>
  </div>

  <!-- ===== LOGIN CARD ===== -->
  <!-- Mobile: full-width, rounded top, slides up over the hero (-mt-6) -->
  <!-- Desktop: fixed 500px width, right-aligned -->
  <div
    class="bg-white shadow-[0_0_15px_rgba(0,0,0,0.3)]
           px-6 md:px-[10px] pt-[20px] pb-[35px]
           text-center
           rounded-t-2xl md:rounded-[15px]
           -mt-6 md:mt-[5vh]
           relative z-10
           w-full md:w-[500px] md:max-w-[92vw]
           md:ml-auto md:mr-[20%]"
  >
    <h3 class="text-black text-[24px] font-black m-0 p-0 leading-tight">
      Welcome to The Unlimited lifestyle!
    </h3>

    <p class="text-[18px] text-[#222] mt-2">
      Login below to unlock your unbelievable benefits.
    </p>

    <div class="h-4"></div>

    <form
      class="space-y-0"
      hx-post="/benefits/tug_login"
      hx-target="#login-result"
      hx-swap="innerHTML"
      hx-indicator="#login-indicator"
    >
      <input name="email_address" type="hidden" value="0" />

      <input
        name="mobile_number"
        type="number"
        maxlength="10"
        step="1"
        required
        class="w-[330px] max-w-full
               px-[5px] py-[5px]
               border-0 border-b-2 border-b-[#999]
               outline-none
               text-center text-[18px] text-[#FF0033]
               focus:border-b-[#FF0033]"
      />

      <div class="mt-2">
        <span class="text-[13px] text-[#999]">
          Enter the cellphone number that you signed up with EG. 0821234567
        </span>
      </div>

      <div class="h-6"></div>

      <input
        type="submit"
        value="LOGIN"
        class="px-[20px] py-[10px]
               bg-[#FF0033] text-white
               border-2 border-white
               outline-none
               text-[16px] font-bold
               cursor-pointer
               hover:bg-white hover:text-[#FF0033] hover:border-[#FF0033]
               transition"
      />

      <div id="login-result" class="mt-4"></div>
    </form>

    <p class="text-[13px] text-[#FF0033] mt-4">
      {{ error or "" }}
    </p>
  </div>

</body>
</html>
