<form
  hx-post="/partner_admin/{{ partner.id }}/update"
  hx-encoding="multipart/form-data"
  hx-target="#partners-tbody"
  hx-swap="innerHTML"
  class="flex flex-col gap-4"
>
  <!-- Hidden: preserve existing image paths -->
  <input type="hidden" name="existing_logo"   value="{{ partner.logo_image or '' }}">
  <input type="hidden" name="existing_landing" value="{{ partner.landing_image or '' }}">

  <!-- Partner Name -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Partner Name</label>
    <input
      type="text"
      name="partner_name"
      value="{{ partner.partner_name or '' }}"
      required
      class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-lime-400"
    />
  </div>

  <!-- Category -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
    <select
      name="book_category_id"
      required
      class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-lime-400"
    >
      <option value="">-- Select category --</option>
      {% for c in categories %}
      <option value="{{ c.id }}" {% if c.id == partner.book_category_id %}selected{% endif %}>
        {{ c.cateogory }}
      </option>
      {% endfor %}
    </select>
  </div>

  <!-- Active toggle -->
  <div class="flex items-center gap-3">
    <span class="text-sm font-medium text-gray-700">Active</span>
    <input type="hidden" name="is_active" id="is_active_hidden" value="{{ '1' if partner.isActive else '0' }}">
    <label class="relative inline-flex items-center cursor-pointer">
      <input
        type="checkbox"
        id="is_active_cb"
        {% if partner.isActive %}checked{% endif %}
        class="sr-only peer"
      >
      <div class="w-10 h-6 bg-gray-300 rounded-full peer peer-checked:bg-lime-500 transition-colors"></div>
      <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full shadow transition-transform peer-checked:translate-x-4"></div>
    </label>
    <span class="text-xs text-gray-400" id="active-label">
      {% if partner.isActive %}Active{% else %}Inactive{% endif %}
    </span>
  </div>

  <!-- Images side by side -->
  <div class="grid grid-cols-2 gap-4">

    <!-- Logo Image -->
    <div class="border rounded-lg p-3 bg-gray-50 flex flex-col gap-2">
      <label class="block text-sm font-medium text-gray-700">
        Logo Image
      </label>
      {% if partner.logo_image %}
      <div class="flex items-center justify-center bg-white border rounded h-24">
        <img src="/static/{{ partner.logo_image }}" alt="Logo" class="max-h-full max-w-full object-contain p-1">
      </div>
      {% else %}
      <div class="flex items-center justify-center bg-white border rounded h-24 text-gray-300">
        <span class="material-symbols-outlined text-3xl">image</span>
      </div>
      {% endif %}
      <p class="text-xs text-gray-400">Leave blank to keep current</p>
      <input
        type="file"
        name="logo_image"
        accept="image/*"
        class="w-full text-xs text-gray-600 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-lime-50 file:text-lime-700 hover:file:bg-lime-100"
      />
    </div>

    <!-- Landing Image -->
    <div class="border rounded-lg p-3 bg-gray-50 flex flex-col gap-2">
      <label class="block text-sm font-medium text-gray-700">
        Landing Image
      </label>
      {% if partner.landing_image %}
      <div class="flex items-center justify-center bg-white border rounded h-24">
        <img src="/static/{{ partner.landing_image }}" alt="Landing" class="max-h-full max-w-full object-contain p-1">
      </div>
      {% else %}
      <div class="flex items-center justify-center bg-white border rounded h-24 text-gray-300">
        <span class="material-symbols-outlined text-3xl">image</span>
      </div>
      {% endif %}
      <p class="text-xs text-gray-400">Leave blank to keep current</p>
      <input
        type="file"
        name="landing_image"
        accept="image/*"
        class="w-full text-xs text-gray-600 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-lime-50 file:text-lime-700 hover:file:bg-lime-100"
      />
    </div>

  </div>

  <!-- Partner Write-up (HTML) -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Partner Write-up <span class="text-gray-400 font-normal">(HTML)</span></label>
    <textarea
      name="partner_write_up"
      rows="5"
      class="w-full border rounded px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-lime-400"
    >{{ partner.partner_write_up or '' }}</textarea>
  </div>

  <!-- Partner Offer (HTML) -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Partner Offer <span class="text-gray-400 font-normal">(HTML)</span></label>
    <textarea
      name="partner_offer"
      rows="5"
      class="w-full border rounded px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-lime-400"
    >{{ partner.partner_offer or '' }}</textarea>
  </div>

  <!-- Actions -->
  <div class="flex justify-end gap-3 pt-2">
    <button
      type="button"
      onclick="closePartnerModal()"
      class="px-4 py-2 text-sm rounded border text-gray-600 hover:bg-gray-100"
    >Cancel</button>
    <button
      type="submit"
      class="px-4 py-2 text-sm rounded bg-lime-600 text-white hover:bg-lime-700"
    >Save Changes</button>
  </div>
</form>

<script>
  document.getElementById('is_active_cb').addEventListener('change', function () {
    document.getElementById('is_active_hidden').value = this.checked ? '1' : '0';
    document.getElementById('active-label').textContent = this.checked ? 'Active' : 'Inactive';
  });
</script>
