<form
  hx-post="/partner_admin/{{ partner_id }}/add-vouchers"
  hx-swap="none"
  class="flex flex-col gap-4"
>
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">
      Voucher Codes <span class="text-gray-400 font-normal">(one per line)</span>
    </label>
    <textarea
      name="voucher_codes"
      rows="15"
      placeholder="831045846417&#10;359655425936&#10;400195373598"
      class="w-full border rounded px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-lime-500"
    ></textarea>
  </div>
  <div class="flex justify-end gap-2">
    <button type="button" onclick="closeVoucherModal()" class="px-4 py-2 text-sm rounded border hover:bg-gray-50">Cancel</button>
    <button type="submit" class="px-4 py-2 bg-lime-600 text-white text-sm rounded hover:bg-lime-700">Upload Vouchers</button>
  </div>
</form>
