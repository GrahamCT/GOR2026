<form
  hx-post="/partner_admin/save"
  hx-encoding="multipart/form-data"
  hx-target="#partners-tbody"
  hx-swap="innerHTML"
  class="flex flex-col gap-4"
>
  <!-- Partner Name -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Partner Name</label>
    <input
      type="text"
      name="partner_name"
      required
      class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-lime-400"
    />
  </div>

  <!-- Category -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
    <select
      name="book_category_id"
      required
      class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-lime-400"
    >
      <option value="">-- Select category --</option>
      {% for c in categories %}
      <option value="{{ c.id }}">{{ c.cateogory }}</option>
      {% endfor %}
    </select>
  </div>

  <!-- Logo Image -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">
      Logo Image
      <span class="text-gray-400 font-normal">(saved as partners/logo_&lt;name&gt;)</span>
    </label>
    <input
      type="file"
      name="logo_image"
      accept="image/*"
      class="w-full text-sm text-gray-600 file:mr-3 file:py-1 file:px-3 file:rounded file:border-0 file:text-sm file:bg-lime-50 file:text-lime-700 hover:file:bg-lime-100"
    />
  </div>

  <!-- Landing Image -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">
      Landing Image
      <span class="text-gray-400 font-normal">(saved as partners/landing_&lt;name&gt;)</span>
    </label>
    <input
      type="file"
      name="landing_image"
      accept="image/*"
      class="w-full text-sm text-gray-600 file:mr-3 file:py-1 file:px-3 file:rounded file:border-0 file:text-sm file:bg-lime-50 file:text-lime-700 hover:file:bg-lime-100"
    />
  </div>

  <!-- Partner Write-up (HTML) -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Partner Write-up <span class="text-gray-400 font-normal">(HTML)</span></label>
    <textarea
      name="partner_write_up"
      rows="5"
      class="w-full border rounded px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-lime-400"
      placeholder="<p>Enter HTML content...</p>"
    ></textarea>
  </div>

  <!-- Partner Offer (HTML) -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Partner Offer <span class="text-gray-400 font-normal">(HTML)</span></label>
    <textarea
      name="partner_offer"
      rows="5"
      class="w-full border rounded px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-lime-400"
      placeholder="<p>Enter HTML content...</p>"
    ></textarea>
  </div>

  <!-- Actions -->
  <div class="flex justify-end gap-3 pt-2">
    <button
      type="button"
      onclick="closePartnerModal()"
      class="px-4 py-2 text-sm rounded border text-gray-600 hover:bg-gray-100"
    >Cancel</button>
    <button
      type="submit"
      class="px-4 py-2 text-sm rounded bg-lime-600 text-white hover:bg-lime-700"
    >Save Partner</button>
  </div>
</form>
